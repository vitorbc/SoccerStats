[project]
name = "brasileirao-stats"
version = "0.1.0"
description = "A friendly explorer for Brazilian first division player and team statistics."
requires-python = ">=3.12,<3.15"
dependencies = [
    "streamlit>=1.45,<2",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
